# Optional operator annotations for the job ledger (claude-coordinator-jobs).
# Copy to ~/.claude/jobs.yaml. Everything here is OPTIONAL: the ledger
# discovers jobs and learns footprints on its own. Use this to label jobs,
# hide one from forecasts, seed a brand-new job's envelope, or put a job
# behind the capacity gate with limits.
#
# `claude-coordinator-jobs install-gates` turns class / gate / memory_max /
# after / nice / io_weight into a systemd drop-in per unit
# (<unit>.service.d/50-claude-jobs.conf). Re-run after editing.
#
# Keys per unit (systemd service name, or "cron:<script-stem>" for crontab):
#   project        label shown in /jobs and `list`
#   notes          free text
#   ignore         true → excluded from forecast / window search / health
#   expect         envelope used when there are no successful runs yet
#                  (or always, with prefer_expect: true): gpu_gb, ram_gb, cores, hours
#   class          production | batch | agent  (gate priority; default batch)
#   gate           false → drop-in gets limits/OnFailure but no gate wrapper
#   max_wait_h     hours to wait for capacity (default: production 6, batch 12, agent 4)
#   on_timeout     run (default) | skip — what to do when max_wait passes
#   memory_max     systemd MemoryMax= (e.g. 64G) — hard cap, protects the box
#   nice / cpu_weight / io_weight   background-friendliness for batch work
#   after          list of units this one should start after (systemd After=)

jobs:
  nightly-retrain.service:
    project: my-model
    class: production
    max_wait_h: 4
    memory_max: 64G
    after: [lake-ingest.service]
    notes: fine-tune + gated promote; VRAM-heavy for ~30 min
  data-harvest.service:
    project: my-lake
    class: batch
    max_wait_h: 6
    on_timeout: skip
    memory_max: 16G
    nice: 10
    io_weight: 50
    expect: {gpu_gb: 0, ram_gb: 6, cores: 2, hours: 2}
  some-noisy-monitor.service:
    ignore: true
